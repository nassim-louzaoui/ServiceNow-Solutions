<div class="oi-audit-log">

  <div class="oi-al-header">
    <h2 class="oi-al-title">Audit Log Viewer</h2>
  </div>

  <div class="oi-al-denied" ng-if="!c.data.authorized">
    <p>{{c.data.message}}</p>
  </div>

  <div ng-if="c.data.authorized">

    <div class="oi-al-filter-bar">
      <div class="oi-al-filter">
        <label class="oi-al-filter-label">Event Key</label>
        <input type="text" class="oi-al-input" ng-model="c.filters.event_key"
               list="oiAuditEventKeys" placeholder="e.g. maintenance_enabled" />
        <datalist id="oiAuditEventKeys">
          <option ng-repeat="key in c.data.event_keys track by key" value="{{key}}"></option>
        </datalist>
      </div>
      <div class="oi-al-filter">
        <label class="oi-al-filter-label">User</label>
        <input type="text" class="oi-al-input" ng-model="c.filters.user"
               placeholder="Name or sys_id" />
      </div>
      <div class="oi-al-filter">
        <label class="oi-al-filter-label">From</label>
        <input type="text" class="oi-al-input" ng-model="c.filters.date_from"
               placeholder="YYYY-MM-DD HH:MM:SS" />
      </div>
      <div class="oi-al-filter">
        <label class="oi-al-filter-label">To</label>
        <input type="text" class="oi-al-input" ng-model="c.filters.date_to"
               placeholder="YYYY-MM-DD HH:MM:SS" />
      </div>
      <div class="oi-al-filter-actions">
        <button type="button" class="oi-al-btn" ng-click="c.applyFilters()">Apply</button>
        <button type="button" class="oi-al-btn oi-al-btn--ghost" ng-click="c.clearFilters()">Clear</button>
      </div>
    </div>

    <div class="oi-al-count">{{c.data.entries.length}} entries</div>

    <div class="oi-al-table-wrap">
      <table class="oi-al-table">
        <thead>
          <tr>
            <th>Time</th><th>Event Key</th><th>User</th><th>Details</th>
          </tr>
        </thead>
        <tbody>
          <tr ng-repeat="entry in c.data.entries track by entry.sys_id">
            <td class="oi-al-when">{{entry.created_on}}</td>
            <td><span class="oi-al-key">{{entry.event_key}}</span></td>
            <td>{{entry.user_name || entry.user_sys_id}}</td>
            <td class="oi-al-details">{{entry.details_pretty}}</td>
          </tr>
          <tr ng-if="c.data.entries.length === 0">
            <td colspan="4" class="oi-al-empty">No audit entries match the current filters.</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

</div>
