<div class="oi-group-metrics">

  <div class="oi-gm-header">
    <h2 class="oi-gm-title">Group Metrics</h2>
    <button type="button" class="oi-gm-refresh" ng-click="c.refresh()" title="Refresh metrics">&#8635;</button>
  </div>

  <div class="oi-gm-denied" ng-if="!c.data.authorized">
    <p>{{c.data.message}}</p>
  </div>

  <div ng-if="c.data.authorized">

    <div class="oi-gm-summary">
      <div class="oi-gm-card">
        <span class="oi-gm-card-value">{{c.data.totals.executions}}</span>
        <span class="oi-gm-card-label">Total Executions</span>
      </div>
      <div class="oi-gm-card">
        <span class="oi-gm-card-value">{{c.data.totals.time_saved_hours}}</span>
        <span class="oi-gm-card-label">Hours Saved</span>
      </div>
      <div class="oi-gm-card">
        <span class="oi-gm-card-value">{{c.data.totals.deliverables}}</span>
        <span class="oi-gm-card-label">Active Deliverables</span>
      </div>
    </div>

    <div class="oi-gm-toggle" role="tablist">
      <button type="button" class="oi-gm-toggle-btn"
              ng-class="{ 'oi-gm-toggle-btn--active': c.isMetric('executions') }"
              ng-click="c.setMetric('executions')">Executions</button>
      <button type="button" class="oi-gm-toggle-btn"
              ng-class="{ 'oi-gm-toggle-btn--active': c.isMetric('time_saved') }"
              ng-click="c.setMetric('time_saved')">Time Saved</button>
      <button type="button" class="oi-gm-toggle-btn"
              ng-class="{ 'oi-gm-toggle-btn--active': c.isMetric('deliverables') }"
              ng-click="c.setMetric('deliverables')">Deliverables</button>
    </div>

    <div class="oi-gm-empty" ng-if="c.data.groups.length === 0">
      <p>{{c.data.message || 'No group data to display.'}}</p>
    </div>

    <ul class="oi-gm-chart" ng-if="c.data.groups.length > 0">
      <li class="oi-gm-bar-row" ng-repeat="group in c.data.groups track by group.group_sys_id">
        <span class="oi-gm-bar-label" title="{{group.group_name}}">{{group.group_name}}</span>
        <div class="oi-gm-bar-track">
          <div class="oi-gm-bar-fill" ng-style="{ width: c.barPct(group) + '%' }"></div>
        </div>
        <span class="oi-gm-bar-value">{{c.barValue(group)}}</span>
      </li>
    </ul>

  </div>

</div>
