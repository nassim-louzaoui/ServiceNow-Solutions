<div class="oi-mv">
  <div class="oi-mv-error" ng-if="c.data.error">{{c.data.error}}</div>

  <div ng-if="!c.data.error" ng-switch="c.data.artifact_type">

    <div ng-switch-when="report" class="oi-mv-frame-wrap">
      <iframe class="oi-mv-frame" ng-src="{{c.trustedUrl}}"></iframe>
    </div>

    <div ng-switch-when="pa_dashboard" class="oi-mv-frame-wrap">
      <iframe class="oi-mv-frame" ng-src="{{c.trustedUrl}}"></iframe>
    </div>

    <div ng-switch-when="ui_page" class="oi-mv-frame-wrap">
      <iframe class="oi-mv-frame" ng-src="{{c.trustedUrl}}"></iframe>
    </div>

    <div ng-switch-when="custom_table" class="oi-mv-frame-wrap">
      <iframe class="oi-mv-frame" ng-src="{{c.trustedUrl}}"></iframe>
    </div>

    <div ng-switch-default class="oi-mv-info" ng-if="c.data.info">
      <div class="oi-mv-info-head">{{c.data.display_name}}</div>
      <table class="oi-mv-info-table">
        <tr ng-repeat="f in c.data.info.fields">
          <th>{{f.label}}</th>
          <td>{{f.value}}</td>
        </tr>
      </table>
      <div class="oi-mv-activity" ng-if="c.data.info.recent_activity.length">
        <div class="oi-mv-activity-head">Recent Activity</div>
        <ul>
          <li ng-repeat="a in c.data.info.recent_activity">
            <span class="oi-mv-act-ref">{{a.number}}</span>
            <span class="oi-mv-act-time">{{a.triggered_at}}</span>
            <span class="oi-mv-act-status oi-mv-act-{{a.status}}">{{a.status}}</span>
          </li>
        </ul>
      </div>
    </div>

  </div>
</div>
