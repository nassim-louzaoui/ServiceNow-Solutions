<div class="oi-approvals">
  <div class="oi-toast oi-toast-success" ng-if="data.message">{{data.message}}</div>
  <div class="oi-toast oi-toast-error" ng-if="data.error">{{data.error}}</div>

  <h2 class="oi-section-title">Pending Approvals</h2>

  <div class="oi-empty" ng-if="data.approvals.length === 0">
    Your approval queue is empty.
  </div>

  <div class="oi-list">
    <div class="oi-approval" ng-repeat="a in data.approvals" ng-class="{ 'oi-escalated': a.escalated }">
      <div class="oi-approval-head">
        <div class="oi-approval-id">
          <span class="oi-badge oi-badge-type">{{a.action_type === 'automation_approval' ? 'Automation' : 'Artifact'}}</span>
          <span class="oi-row-number">{{a.number}}</span>
          <span class="oi-badge oi-badge-escalated" ng-if="a.escalated">Escalated</span>
        </div>
        <div class="oi-deadline" ng-class="{ 'oi-deadline-late': c.isOverdue(a) }">
          {{c.countdown(a)}}
        </div>
      </div>

      <div class="oi-approval-body">
        <div class="oi-approval-title">{{a.title}}</div>
        <div class="oi-approval-sub">{{a.subtitle}}</div>
        <div class="oi-approval-meta">
          <span ng-if="a.ref_number">{{a.ref_number}}</span>
          <span ng-if="a.related_group">Group: {{a.related_group}}</span>
          <span ng-if="a.subject_user">Requested by: {{a.subject_user}}</span>
        </div>
      </div>

      <div class="oi-approval-actions" ng-if="c.activeReject !== a.sys_id">
        <button class="oi-btn oi-btn-success" ng-click="c.approve(a)" ng-disabled="c.busy">Approve</button>
        <button class="oi-btn oi-btn-danger" ng-click="c.openReject(a)" ng-disabled="c.busy">Reject</button>
      </div>

      <div class="oi-reject-form" ng-if="c.activeReject === a.sys_id">
        <textarea class="oi-textarea" ng-model="c.rejectReason" placeholder="Reason for rejection (required)"></textarea>
        <div class="oi-reject-actions">
          <button class="oi-btn" ng-click="c.cancelReject()" ng-disabled="c.busy">Cancel</button>
          <button class="oi-btn oi-btn-danger" ng-click="c.confirmReject(a)" ng-disabled="c.busy || !c.rejectReason">Confirm Rejection</button>
        </div>
      </div>
    </div>
  </div>
</div>
